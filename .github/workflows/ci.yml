name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an older run when new commits are pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests (Jest)
        run: npm test -- --ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Both Playwright projects (Desktop Chrome, Pixel 7) run on Chromium.
      # The config's webServer builds and starts the app; CI=true makes it
      # start a fresh server and enables retries.
      - name: E2E tests (Playwright)
        id: e2e
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
